<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a review</title>
<style>/*BASE*/
body{font-size:1.0625rem}
.band{position:relative;overflow:hidden;color:#fff;padding:1.2rem 1rem 3.2rem;
background:radial-gradient(18rem 10rem at 100% 0%,rgba(245,179,1,.4),transparent 70%),linear-gradient(135deg,#0B5F58,#0F766E 60%,#14B8A6)}
.band::after{content:"";position:absolute;width:12rem;height:12rem;border-radius:50%;border:28px solid rgba(255,255,255,.07);left:-4rem;bottom:-7rem}
.band-in{position:relative;z-index:1;max-width:480px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.av{display:grid;place-items:center;flex:none;width:52px;height:52px;border-radius:16px;background:#fff;color:#0F766E;font-weight:800;font-size:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.who{flex:1;min-width:10rem} .who h1{font-size:1.35rem;line-height:1.2;margin:0} .who small{opacity:.9}
.langpick{display:inline-flex;align-items:center;gap:.3rem;margin:0;padding:0 .2rem 0 .6rem;border-radius:999px;background:rgba(255,255,255,.18);font-weight:600}
.langpick select{width:auto;min-height:40px;border:0;background:transparent;color:#fff;padding:0 .4rem;font-weight:600}
.langpick option{color:#2B211A}
main{position:relative;z-index:1;max-width:480px;margin:-2.2rem auto 0;padding:0 1rem}
.panel{background:var(--s);border:1px solid var(--b);border-radius:18px;padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.rate{text-align:center} .rate p{margin:.2rem 0}
#how{font-size:1.2rem;font-weight:700}
.stars{display:flex;justify-content:center;gap:.2rem}
.stars button{width:54px;height:56px;padding:0;background:none;font-size:2.8rem;line-height:1;color:var(--star0)}
.stars button.on{color:var(--star);animation:pop .35s ease-out}
@keyframes pop{50%{transform:scale(1.3)}}
.mood{font-size:2rem;line-height:1;min-height:2rem;margin-top:.3rem}
.done{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:1.5rem;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
.done[hidden]{display:none}
.done-card{max-width:22rem;text-align:center;background:var(--s);border-radius:22px;padding:1.8rem 1.5rem;box-shadow:var(--shadow);border:1px solid var(--b)}
.done-card svg{display:block;margin:0 auto .8rem}
.done-card circle{fill:var(--p)} .done-card path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.by{display:flex;justify-content:center;align-items:center;gap:.4rem;margin:1.5rem 0 2rem;color:var(--m);font-size:.8125rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips button{padding:0 .9rem;border-radius:999px;font-weight:400;background:var(--s);color:var(--t);border:1px solid var(--b2)}
.chips button[aria-pressed=true]{background:var(--p);color:#fff;border-color:var(--p)}
.chips button[aria-pressed=true]::before{content:"✓"}
#list button{display:block;position:relative;width:100%;text-align:left;margin:.5rem 0;padding:.9rem 2.2rem .9rem 1rem;
font-weight:400;line-height:1.5;background:var(--s);color:var(--t);border:1px solid var(--b);border-radius:var(--r)}
#list button:hover{border-color:var(--b2)}
#list button[aria-pressed=true]{background:var(--pt);border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
#list button[aria-pressed=true]::after{content:"✓";position:absolute;top:.7rem;right:.9rem;color:var(--p2);font-weight:700}
.skeleton{height:4.5rem;margin:.5rem 0;border-radius:var(--r);background:var(--track)}
.cta{position:sticky;bottom:0;z-index:2;background:linear-gradient(transparent,var(--bg) 25%);padding:1rem 0 max(.75rem,env(safe-area-inset-bottom))}
#status{margin:.2rem .3rem .4rem;font-weight:600;color:var(--m)}
#chipsWrap p{margin:0 0 .6rem;font-weight:600}
.panel label{margin-top:0}
.cta p{margin:.4rem 0 0;text-align:center}
.primary{width:100%;min-height:52px;font-size:1.0625rem}
details{margin:.5rem 0 1rem;background:var(--warm);border:1px dashed var(--b2);border-radius:var(--r);padding:0 1rem}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details form{padding-bottom:1rem}
.secondary{width:100%;margin-top:1rem;background:var(--s);color:var(--p2);border:1px solid var(--p)}
</style>
</head>
<body>
<script id="data" type="application/json">__DATA__</script>
<header class="band"><div class="band-in">
  <span class="av" id="av" aria-hidden="true"></span>
  <div class="who"><h1 id="title"></h1><small data-t="sub"></small></div>
  <label class="langpick"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
    <select id="lang" aria-label="Language / भाषा"></select></label>
</div></header>
<main>
<section class="panel rate">
  <p id="how" data-t="how"></p>
  <div class="stars" role="group" aria-labelledby="how"></div>
  <div class="mood" id="mood" aria-hidden="true"></div>
  <p class="muted" id="starhint" data-t="tapStar"></p>
</section>
<section class="panel" id="chipsWrap" hidden><p data-t="liked"></p><div class="chips" id="chips"></div></section>
<p id="status" aria-live="polite"></p>

<div id="step2" hidden>
  <div id="list"></div>
  <section class="panel">
  <label for="text" data-t="yours"></label>
  <textarea id="text" rows="4"></textarea>
  </section>
  <div class="cta">
    <button class="primary" id="go" data-t="go" disabled></button>
    <p class="muted" id="gohint" aria-live="polite" data-t="goHint"></p>
  </div>
  <details>
    <summary data-t="private"></summary>
    <form id="fb">
      <label for="fbmsg" data-t="msg"></label>
      <textarea id="fbmsg" required maxlength="2000"></textarea>
      <label for="fbcontact" data-t="contact"></label>
      <input id="fbcontact" maxlength="200" autocomplete="tel">
      <button class="secondary" id="fbsend" data-t="send"></button>
    </form>
    <p id="fbstatus" aria-live="polite"></p>
  </details>
</div>
<p class="by">__LOGO__ Powered by DukanReviews</p>
</main>
<div class="done" id="done" hidden role="status" aria-live="assertive"><div class="done-card">

  <p id="donemsg"></p></div></div>

  $("list").innerHTML = "";
  $("status").textContent = r.reviews?.length ? t("pick") : t("failed");
  for (const text of r.reviews || []) {
    const b = document.createElement("button");
    b.textContent = text;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      [...$("list").children].forEach((x) => x.setAttribute("aria-pressed", x === b));
      $("text").value = text;
      syncGo();
    };
    $("list").append(b);
  }
}

const syncGo = () => ($("go").disabled = !$("text").value.trim());
$("text").oninput = syncGo;

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  $("text").select(); // older phones / in-app scanners without the clipboard API
  try { return document.execCommand("copy"); } catch { return false; }
}

$("go").onclick = async () => {
  const text = $("text").value;
  sessionStorage.setItem(KEY, JSON.stringify({ rating, lang: $("lang").value, text }));
  if (!copyFailed && !(await copy(text))) {
    copyFailed = true;
    $("text").select();
    $("gohint").textContent = t("copyFail");
    $("go").textContent = t("cont");
    return;
  }
  $("go").disabled = true;
  $("donemsg").textContent = t("copied");
  $("done").hidden = false;
  post("/api/event", { slug: D.slug, type: "copy", rating, lang: $("lang").value });
  setTimeout(() => (location.href = D.googleUrl), 1500); // give them time to read the paste tip
};

$("fb").onsubmit = async (e) => {
  e.preventDefault();
  $("fbsend").disabled = true;
  $("fbstatus").textContent = t("sending");
  const r = await post("/api/feedback", { slug: D.slug, rating, message: $("fbmsg").value, contact: $("fbcontact").value }).catch(() => null);
  if (r?.ok) { $("fb").hidden = true; $("fbstatus").textContent = t("sent"); }
  else { $("fbsend").disabled = false; $("fbstatus").textContent = t("sendFail"); }
};

// Count one scan per visit, and restore the draft if they come back from Google.
if (!sessionStorage.getItem(`scan:${D.slug}`)) {
  sessionStorage.setItem(`scan:${D.slug}`, "1");
  post("/api/event", { slug: D.slug, type: "scan" });
}
const saved = JSON.parse(sessionStorage.getItem(KEY) || "null");
if (saved?.lang) $("lang").value = saved.lang;
applyLang();
if (saved?.rating) { pick(saved.rating); $("text").value = saved.text || ""; syncGo(); }
// The back button may restore this page as it was when we left for Google.
addEventListener("pageshow", () => { $("done").hidden = true; syncGo(); });
</script>
</body>
</html>
